<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>pgpilot at Coupe Icare</title>

    <!-- Everything below is local. This page must work with the network cable
         pulled out, because the stand has no wifi worth trusting. -->
    <link rel="stylesheet" href="reveal/reset.css" />
    <link rel="stylesheet" href="reveal/reveal.css" />
    <link rel="stylesheet" href="kiosk.css?v=4" />
  </head>
  <body>
    <div class="reveal">
      <!-- Filled in by kiosk.js from slides.js, which build.py writes. -->
      <div class="slides"></div>
    </div>

    <!-- Fixed to the viewport, not to a slide, so it survives every layout.
         One store code per platform, labelled, so a passer-by sees that both
         phones are covered and scans the right one without asking. -->
    <div class="corner-qr" aria-label="Get pgpilot">
      <span class="corner-qr-head">Get pgpilot</span>
      <div class="corner-qr-row">
        <a class="corner-qr-store" href="https://apps.apple.com/app/id6759820116">
          <img src="img/qr-appstore.svg" alt="QR code for pgpilot on the App Store" />
          <strong>iPhone</strong>
          <span>App Store</span>
        </a>
        <a class="corner-qr-store" href="https://play.google.com/store/apps/details?id=com.pgfly.app">
          <img src="img/qr-googleplay.svg" alt="QR code for pgpilot on Google Play" />
          <strong>Android</strong>
          <span>Google Play</span>
        </a>
      </div>
    </div>

    <nav class="hotkeys" aria-label="Jump to a feature"></nav>

    <script src="reveal/reveal.js"></script>
    <script src="slides.js?v=4"></script>
    <script src="kiosk.js?v=4"></script>
  </body>
</html>
